<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-wrapper {
            position: relative;
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            padding: 3px;
            background: linear-gradient(90deg, #ff007f, #00f2fe, #4facfe, #00ff87, #ff007f);
            background-size: 300% 300%;
            animation: gradientMove 4s linear infinite;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .card {
            background-color: #121824;
            border-radius: 17px;
            padding: 25px;
            color: #ffffff;
            text-align: center;
            overflow: hidden;
            transition: all 0.5s ease-in-out;
        }


        .toggle-btn {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            padding: 10px 0;
            outline: none;
        }

        .form-content {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0, 1, 0, 1), opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-wrapper.open .form-content {
            max-height: 500px;
            opacity: 1;
            margin-top: 15px;
            transition: max-height 0.6s ease-in-out, opacity 0.6s ease-in-out;
        }

        .card-wrapper.open .toggle-btn {
            margin-bottom: 10px;
        }

        .description {
            color: #a0aec0;
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 10px 0;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4C23D1;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .action-btn:hover {
            background: #A81C1C;
            transform: scale(1.5);
        }
    </style>
</head>

<body>

    <div class="card-wrapper" id="cardWrapper">
        <div class="card">
            <button class="toggle-btn" onclick="toggleCard()">Welcome Student to the CSL</button>

            <div class="form-content">
                <p class="description">
                    We build beautiful, highly responsive webpages for student to make interact with csl.
                </p>
                <button class="action-btn" onclick="window.location.href='login.html';">Get Started</button>
            </div>
        </div>
    </div>

    <script>
        function toggleCard() {
            const wrapper = document.getElementById('cardWrapper');
            wrapper.classList.toggle('open');
        }

    </script>
    <script src="login.html"></script>

</body>

</html>
